<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F3F6FA; overflow: hidden; }
  #app {
    position: fixed; inset: 0; width: 100%; height: 100%;
    border: 0; display: block; background: #F3F6FA;
  }
  #splash {
    position: fixed; inset: 0; z-index: 10; background: #102A43; color: #FFFFFF;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    font-family: Inter, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;
    transition: opacity .35s ease;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  .logo-full { background: #FFFFFF; border-radius: 18px; padding: 14px 22px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .logo-full img { display: block; width: 260px; max-width: 70vw; height: auto; }
  .title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 24px; }
  .sub { font-size: 14px; color: #B7C7D9; }
  .spin { width: 26px; height: 26px; border: 3px solid rgba(255,255,255,.25); border-top-color: #F2B33D; border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .credit { position: absolute; bottom: 20px; left: 0; right: 0; font-size: 12px; color: #B7C7D9; }
  .credit b { color: #FFFFFF; }
  .fallback { display: none; font-size: 13px; color: #D8E2EE; max-width: 340px; line-height: 1.5; }
  .fallback a { color: #F2B33D; font-weight: 600; }
</style>
</head>
